name: Build AI Phone Assistant APK
on:
  push:
    branches: [feature/ai-phone-assistant, feature/ai-phone-assistant-deepseek-03]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: ai-phone-assistant
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AIPhoneAssistant-debug-apk
          path: ai-phone-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
