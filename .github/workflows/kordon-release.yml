name: Лесной кордон • Android
on:
  push:
    branches: [game/kordon-android]
    paths: ['kordon/**', '.github/workflows/kordon-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Подпись двух последовательных версий
        env:
          STORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_B64" && test -n "$SIGNING_PASSWORD"
          export SIGNING_STORE="$RUNNER_TEMP/kordon.jks"
          trap 'rm -f "$SIGNING_STORE"' EXIT
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$SIGNING_STORE"
          CODE=$((2*GITHUB_RUN_NUMBER))
          bash kordon/build.sh "$((CODE-1))" "$RUNNER_TEMP/previous.apk"
          bash kordon/build.sh "$CODE" "$RUNNER_TEMP/Lesnoy-Kordon.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fingerprint() { "$SIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          FP=$(fingerprint "$RUNNER_TEMP/Lesnoy-Kordon.apk")
          test -n "$FP" && test "$FP" = "$(fingerprint "$RUNNER_TEMP/previous.apk")"
          if test -f kordon/signer.sha256; then test "$FP" = "$(cat kordon/signer.sha256)"; fi
          echo "Certificate SHA-256: $FP" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Lesnoy-Kordon-release
          path: ${{ runner.temp }}/Lesnoy-Kordon.apk
          if-no-files-found: error
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kordon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Установка обновления на Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: bash kordon/check-update.sh
