name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Тесты логики и debug APK
        run: ./gradlew :domain:test :app:assembleDebug --stacktrace

      - name: Release-ключ из секретов
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=overtime" >> "$GITHUB_ENV"

      - name: Подписанный release APK
        if: env.HAS_RELEASE_KEY == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Отпечаток подписи
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "::notice title=Подпись release::SHA-256 $FP"

      - name: Выложить release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: overtime-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Скриншоты экранов
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          if ! ./gradlew :app:recordPaparazziDebug 2>&1 | tee "$RUNNER_TEMP/shots.log"; then
            grep -E "^e: |error:|Exception|Caused by|FAILED|What went wrong" -A 3 "$RUNNER_TEMP/shots.log" | head -60 | while IFS= read -r line; do
              echo "::error title=Скриншоты::$line"
            done
            exit 1
          fi

      - name: Выложить скриншоты в ветку ui-snapshots
        if: steps.shots.outcome == 'success'
        continue-on-error: true
        run: |
          SRC=$(pwd)/app/src/test/snapshots/images
          ls "$SRC"
          DIR=$(mktemp -d)
          cp "$SRC"/*.png "$DIR"/
          cd "$DIR"
          git init -q
          git checkout -q -b ui-snapshots
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Скриншоты для ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-snapshots

      - name: Нет release-ключа
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::warning title=Release не собран::Добавьте секреты RELEASE_KEYSTORE_BASE64 и RELEASE_PASSWORD, чтобы собирать подписанный APK для RuStore."

      - name: Выложить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: overtime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
