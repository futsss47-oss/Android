<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"><title>Лесной кордон</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" aria-label="Игровое поле"></canvas>
<header><div class="plate"><b id="area">ПРИДОРОЖНЫЙ ПОСЁЛОК</b><div class="vitals"><i title="Здоровье">♥</i><meter id="hp" max="100" value="100"></meter><i title="Сытость">◒</i><meter id="sat" max="100" value="80"></meter></div></div><div class="right"><span id="clock"></span><button id="journal" aria-label="Открыть полевой журнал">☰</button></div></header>
<div id="target"></div><div id="toast" role="status"></div>
<div id="stick" aria-label="Джойстик"><i></i></div>
<div id="actions"><button id="build">Забор</button><button id="fire">Выстрел</button><button id="eat">Поесть</button><button id="use">Осмотреть</button></div>
<div id="menu"><section><small>ПОЛЕВОЙ ЖУРНАЛ</small><h1>Лесной кордон</h1><p id="entry"></p><div id="stats"></div><div id="help">Движение — джойстик или WASD. E — действие, F — выстрел, Q — еда, B — забор. Стрельба по ближайшему видимому зомби привлекает остальных.</div><button id="resume"></button></section></div>
<script src="game.js"></script><script src="draw.js"></script></body></html>
